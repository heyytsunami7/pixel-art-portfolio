<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>pixel-lake demo</title>
<style>
  :root{ --bg:#0a0a0b; --surface:#121214; --ink:#e9e7e2; --dim:#83817c; --line:rgba(255,255,255,.12); }
  body.light{ --bg:#f6f4ee; --surface:#fff; --ink:#1b1a16; --dim:#6b6a63; --line:rgba(10,10,11,.12); }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--bg); color:var(--ink); font:14px/1.6 ui-monospace, 'DM Mono', monospace; padding:32px 20px; transition:background .3s,color .3s; }
  .wrap{ max-width:660px; margin:0 auto; }
  h1{ font-size:15px; font-weight:600; margin-bottom:14px; }
  .card{ position:relative; overflow:hidden; text-align:center; min-height:360px; border:1px solid var(--line); border-radius:16px; background:var(--surface); }
  .card > :not(canvas){ position:relative; z-index:1; }
  .card h2{ font:400 48px/1.05 Georgia, serif; letter-spacing:-.02em; margin-bottom:14px; }
  .card p{ color:var(--dim); max-width:380px; margin:0 auto; }
  .controls{ display:flex; flex-wrap:wrap; gap:8px 16px; margin-top:18px; color:var(--dim); font-size:12.5px; }
  label{ display:inline-flex; align-items:center; gap:6px; cursor:pointer; }
  button{ font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:4px 12px; cursor:pointer; }
</style>
</head>
<body>
<div class="wrap">
  <h1>pixel-lake — demo</h1>
  <div class="card">
    <canvas id="lake" role="img" aria-label="Halftone stippled landscape" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"></canvas>
  </div>
  <div class="controls" id="controls">
    <button id="themeBtn">toggle theme</button>
  </div>
</div>
<script type="module">
  import { createPixelLake, DEFAULTS } from '../src/index.js';
  const lake = createPixelLake(document.getElementById('lake'), { theme: 'dark' });
  window.__lake = lake;
  let theme = 'dark';
  document.getElementById('themeBtn').onclick = () => {
    theme = theme === 'dark' ? 'light' : 'dark';
    document.body.classList.toggle('light', theme === 'light');
    lake.setOptions({ theme });
  };
  const box = document.getElementById('controls');
  for (const k of Object.keys(DEFAULTS.effects)){
    const l = document.createElement('label'), c = document.createElement('input');
    c.type = 'checkbox'; c.checked = true;
    c.onchange = () => lake.setOptions({ effects: { [k]: c.checked } });
    l.append(c, k); box.append(l);
  }
</script>
</body>
</html>
