<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>pixel-lake — demo</title>
<style>
  :root{ --bg:#0a0a0b; --surface:#121214; --ink:#e9e7e2; --dim:#83817c; --line:rgba(255,255,255,.12); --accent:rgb(196,250,102); }
  body.light{ --bg:#f6f4ee; --surface:#ffffff; --ink:#1b1a16; --dim:#6b6a63; --line:rgba(10,10,11,.14); --accent:rgb(38,128,84); }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--bg); color:var(--ink); font:13.5px/1.6 ui-monospace, 'DM Mono', Menlo, monospace; padding:36px 20px 60px; transition:background .4s, color .4s; }
  .wrap{ max-width:680px; margin:0 auto; }
  h1{ font-size:15px; font-weight:600; margin-bottom:4px; }
  .sub{ color:var(--dim); margin-bottom:18px; }
  .card{ position:relative; overflow:hidden; text-align:center; min-height:360px; border:1px solid var(--line); border-radius:16px; background:var(--surface); transition:background .4s, border-color .4s; }
  .card > :not(canvas){ position:relative; z-index:1; }
  .card h2{ font:400 clamp(38px,9vw,50px)/1.05 Georgia, 'Instrument Serif', serif; letter-spacing:-.02em; margin-bottom:14px; }
  .card p{ color:var(--dim); max-width:380px; margin:0 auto 24px; }
  .btn{ display:inline-block; padding:10px 22px; border-radius:10px; background:var(--ink); color:var(--bg); border:0; font:500 13.5px system-ui, sans-serif; cursor:pointer; }
  .panel{ margin-top:22px; padding:16px 18px; border:1px solid var(--line); border-radius:12px; background:var(--surface); }
  .panel h3{ font-size:11.5px; font-weight:500; color:var(--dim); letter-spacing:.06em; text-transform:uppercase; margin-bottom:12px; }
  .row{ display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; }
  label{ display:inline-flex; align-items:center; gap:7px; cursor:pointer; color:var(--ink); }
  input[type=checkbox]{ accent-color:var(--accent); }
  input[type=range]{ accent-color:var(--accent); width:110px; }
  .tbtn{ font:inherit; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:8px; padding:5px 14px; cursor:pointer; }
  .tbtn:hover{ border-color:var(--accent); color:var(--accent); }
  .note{ margin-top:14px; color:var(--dim); font-size:12px; }
  code{ color:var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>pixel-lake</h1>
  <p class="sub">animated halftone moonlit lake · canvas · zero dependencies</p>

  <div class="card">
    <canvas id="lake" role="img" aria-label="Halftone stippled landscape: moonlit mountains above a still lake, pines on the shore" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"></canvas>
  </div>

  <div class="panel">
    <h3>options</h3>
    <div class="row">
      <button class="tbtn" id="themeBtn">theme: dark</button>
      <label>density <input type="range" id="density" min="0.3" max="1.5" step="0.1" value="1"><span id="dv">1.0</span></label>
      <label>fps <input type="range" id="fps" min="10" max="60" step="5" value="30"><span id="fv">30</span></label>
    </div>
  </div>
  <div class="panel">
    <h3>effects</h3>
    <div class="row" id="effects"></div>
    <p class="note">Everything is toggleable via <code>effects</code>. Prefers-reduced-motion visitors get a still frame; animation pauses when off-screen or in a hidden tab.</p>
  </div>
</div>

<script type="module">
/* ============ pixel-lake core (inlined so this page works standalone) ============ */
/**
 * pixel-lake — an animated halftone / stipple moonlit lake for <canvas>.
 * Framework-free: createPixelLake(canvas, options) -> { setOptions, redraw, play, pause, destroy }
 */
const TAU = 6.2832;
const STATIC_T = 2.1; // time (s) used for the still frame (reduced motion / paused)

const PALETTE = {
  dark:  { ink: '233,231,226', accent: '196,250,102' },
  light: { ink: '27,26,22',    accent: '38,128,84'   },
};

const DEFAULTS = {
  theme: 'dark',                 // 'dark' | 'light'
  ink: null,                     // 'r,g,b' | [r,g,b] | '#rrggbb' (null = theme default)
  accent: null,                  // colour of the fireflies
  fps: 30,                       // animation frame rate
  density: 1,                    // scales stars / halo / glints / fireflies (use ~0.5 on phones)
  respectReducedMotion: true,    // render a still frame when the user prefers reduced motion
  pauseOffscreen: true,          // stop animating when scrolled out of view
  effects: { stars: true, halo: true, glints: true, fireflies: true, ripples: true, birds: true, shootingStar: true,
             clouds: true, mist: true, reflections: true, leaves: true, owl: true },
};

function toRgb(v, fallback){
  if (v == null) return fallback;
  if (Array.isArray(v)) return v.slice(0, 3).map(n => Math.round(n)).join(',');
  v = String(v).trim();
  const hex = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(v);
  if (hex){
    let h = hex[1]; if (h.length === 3) h = h.split('').map(c => c + c).join('');
    return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)).join(',');
  }
  return v.replace(/rgb\(|\)|\s/g, '') || fallback;
}

function merge(base, patch){
  const out = { ...base, ...(patch || {}) };
  out.effects = { ...base.effects, ...((patch && patch.effects) || {}) };
  return out;
}

function createPixelLake(canvas, options = {}){
  if (!canvas || typeof canvas.getContext !== 'function') throw new Error('createPixelLake: a <canvas> element is required');
  const vctx = canvas.getContext('2d');
  let opts = merge(DEFAULTS, options);
  let scene = null, raf = 0, onScreen = true, lastT = 0, destroyed = false, paused = false, resizeTimer = 0;
  const startT = performance.now();
  const now = () => (performance.now() - startT) / 1000;
  const reducedMQ = typeof matchMedia === 'function' ? matchMedia('(prefers-reduced-motion: reduce)') : null;
  const reduced = () => !!(opts.respectReducedMotion && reducedMQ && reducedMQ.matches);
  const running = () => !destroyed && !paused && onScreen && !document.hidden && !reduced();
  const palette = () => {
    const p = PALETTE[opts.theme === 'light' ? 'light' : 'dark'];
    return { ink: toRgb(opts.ink, p.ink), accent: toRgb(opts.accent, p.accent) };
  };

  const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const sstep = t => { t = cl(t); return t * t * (3 - 2 * t); };
  function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const tr = mulberry(7), TAB = Array.from({ length: 512 }, () => tr());
  function vn(x){ const i = Math.floor(x), f = x - i;
    const a = TAB[((i % 512) + 512) % 512], b = TAB[(((i + 1) % 512) + 512) % 512];
    return a + (b - a) * sstep(f); }

function draw(){
    const light = opts.theme === 'light';
    const W = canvas.clientWidth || 600, H = canvas.clientHeight || Math.round(W * .4), dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * dpr; canvas.height = H * dpr;
    const base = document.createElement('canvas'); base.width = W * dpr; base.height = H * dpr;
    const ctx = base.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    const { ink, accent } = palette();
    const hz = H * .74, mx = W * .72, my = H * .25, R = H * .11;

    const back  = x => H * .62 - H * .32 * sstep(cl((vn(x / W * 2.4 + 3) - .25) * 1.6));
    const mid   = x => H * .70 - H * .22 * sstep(cl((vn(x / W * 3.3 + 11) - .25) * 1.6));
    const front = x => hz - 2   - H * .10 * sstep(cl((vn(x / W * 4.5 + 21) - .25) * 1.6));

    function landT(x, y){
      const rf = front(x);
      if (y > rf) return .07 + .18 * Math.exp(-(y - rf) / 5);
      const rm = mid(x);
      if (y > rm) return .15 + .22 * Math.exp(-(hz - y) / (H * .07)) + .2 * Math.exp(-(y - rm) / 5);
      const rb = back(x);
      if (y > rb) return .27 + .3 * Math.exp(-(hz - y) / (H * .09)) + .22 * Math.exp(-(y - rb) / 6);
      const dx = x - mx, dy = y - my, dd = Math.sqrt(dx * dx + dy * dy);
      let t = (light ? .86 : .07) + (light ? .10 : .20) * Math.pow(cl(y / hz), 3);
      if (dd < R){
        t = light ? 1 : .96;
        if (vn(x * .09 + 3) * vn(y * .09 + 7) > .42) t -= .14;
        t -= .16 * (R - dx) / (2 * R);
      } else if (light) t -= .08 * Math.exp(-(dd - R) / (R * .5));
      else t += .35 * Math.exp(-(dd - R) / (R * 1.1));
      return cl(t);
    }

    const TREES = [[.09,.6],[.15,.48],[.21,.38],[.27,.28],[.9,.4],[.85,.3]];
    const groundY = x => Math.min(
      H * 1.02 - H * .21 * Math.pow(cl(1 - x / (W * .4)), 1.2),
      H * 1.02 - H * .16 * cl((x - W * .8) / (W * .2)));
    function groundT(x, y){
      if (y > groundY(x)) return .03 + .07 * vn(x * .25 + y * .4);
      for (const [tx, th] of TREES){
        const X = tx * W, hh = th * H, yb = groundY(X) + 2, t = (yb - y) / hh;
        if (t < 0 || t > 1) continue;
        if (Math.abs(x - X) < hh * .13 * (1 - t) * (.6 + .4 * ((t * 5) % 1))) return .02;
      }
      return -1;
    }

    function T(x, y){
      const gt = groundT(x, y); if (gt >= 0) return gt;
      if (y < hz) return landT(x, y);
      const dep = (y - hz) / (H - hz), yr = Math.max(0, 2 * hz - y);
      const xr = x + Math.sin(y * .6 + vn(x * .02) * 6) * (1.5 + dep * 5);
      const base = landT(xr, yr), rip = .72 + .28 * Math.sin(y * 1.7 + vn(x * .05 + y * .2) * 5);
      let t = light ? 1 - (1 - base) * .7 * rip * (1 - .45 * dep) : base * .75 * rip * (1 - .45 * dep);
      const ex = (x - mx) / (R * .9);
      const gl = Math.exp(-ex * ex) * (.55 + .45 * Math.sin(y * 2.3 + vn(x * .1) * 4)) * (1 - dep * .6);
      t += (light ? 1 - t : 1) * .45 * Math.max(0, gl);
      return cl(t);
    }

    const g = 3.4, rowH = g * .866, rnd = mulberry(101);
    ctx.fillStyle = 'rgb(' + ink + ')'; ctx.globalAlpha = .92;
    for (let r = 0, y = rowH / 2; y < H; y += rowH, r++){
      for (let x = (r % 2 ? g : g / 2); x < W; x += g){
        let d = T(x, y); d = light ? 1 - d : d;
        d *= sstep(x / (W * .05)) * sstep((W - x) / (W * .05)) * sstep(y / (H * .12)) * sstep((H - y) / (H * .06));
        if (d < .03) continue;
        const rad = g * .62 * Math.sqrt(Math.min(1, d));
        if (rad < .32) continue;
        ctx.beginPath(); ctx.arc(x + (rnd() - .5) * .9, y + (rnd() - .5) * .9, rad, 0, 6.2832); ctx.fill();
      }
    }

    const sr = mulberry(55), stars = [];
    for (let i = 0, n = Math.round((light ? 40 : 120) * opts.density); i < n; i++){
      const x = sr() * W, y = sr() * hz * .75, rad = .6 + sr() * .9, al = .6 + sr() * .4;
      if (Math.hypot(x - mx, y - my) < R * 1.7 || y > back(x) - 4) continue;
      if (x < W * .04 || x > W * .96 || y < H * .05) continue;
      stars.push({ x, y, rad, al, ph: sr() * 6.28, sp: 1.3 + sr() * 2.4 });
    }
    // soft stippled halo around the moon
    const hr = mulberry(77), halo = [];
    for (let i = 0, n = Math.round(72 * opts.density); i < n; i++){
      const a = hr() * 6.2832, r = R * (1.2 + hr() * .9);
      halo.push({ x: mx + Math.cos(a) * r, y: my + Math.sin(a) * r, rad: .7 + hr() * .8, ph: (r - R) / R });
    }
    // glints shimmering on the water under the moon
    const glints = [];
    for (let i = 0, n = Math.round(64 * opts.density); i < n; i++){
      const dep = hr(), y = hz + 3 + dep * (H - hz) * .8;
      glints.push({ y, amp: 3 + dep * 16, w: 4 + hr() * (5 + dep * 12), sp: .9 + hr() * 1.5, ph: hr() * 6.28, base: .6 + hr() * .4 });
    }
    // fireflies drifting around the pines on both shores
    const flies = [];
    for (let i = 0, n = Math.round(18 * opts.density); i < n; i++){
      const left = i % 3 !== 2;
      flies.push({ x: left ? W * (.05 + hr() * .3) : W * (.83 + hr() * .13), y: H * (.5 + hr() * .4),
        ax: 6 + hr() * 16, ay: 4 + hr() * 10, sx: .25 + hr() * .5, sy: .2 + hr() * .5, bs: .5 + hr() * .9, ph: hr() * 6.28 });
    }
    // drifting stippled clouds
    const clouds = [];
    for (let i = 0; i < 3; i++){
      const w = W * (.2 + hr() * .16), h = H * (.05 + hr() * .04), dots = [];
      for (let k = 0; k < 80; k++){
        const gx = (hr() + hr() + hr() - 1.5) / 1.5, gy = (hr() + hr() + hr() - 1.5) / 1.5;
        dots.push({ dx: gx * w / 2, dy: gy * h / 2, r: .6 + hr() * 1.1, a: (.12 + hr() * .3) * (1 - Math.min(1, Math.hypot(gx, gy) * .8)) });
      }
      clouds.push({ x0: hr() * (W + 2 * w), y: H * (.1 + i * .06 + hr() * .03), w, sp: 3 + hr() * 4, dots });
    }
    // low mist hugging the horizon
    const mist = [];
    for (let i = 0, n = Math.round(90 * opts.density); i < n; i++){
      mist.push({ x: hr() * W, y: hz - 11 + hr() * 17, r: .8 + hr() * .8, sp: 4 + hr() * 6, ph: hr() * 6.28, a: .12 + hr() * .2 });
    }
    // leaves drifting down from the pines
    const leaves = [];
    for (let i = 0; i < 12; i++){
      const [tx, th] = TREES[i % TREES.length], X = tx * W, top = groundY(X) + 2 - th * H * (.7 + hr() * .25);
      leaves.push({ x: X + (hr() - .5) * 10, y: top, fall: H * (.18 + hr() * .12), sp: 5 + hr() * 7, sway: 5 + hr() * 9, ph: hr() * 6.28, off: hr() * 30, sz: 1.1 + hr() * .9 });
    }
    // two eyes blinking in the pine on the left
    const ox = TREES[1][0] * W, oy = groundY(ox) + 2 - TREES[1][1] * H * .6, owl = { x: ox, y: oy };
    scene = { base, W, H, hz, dpr, stars, halo, glints, flies, clouds, mist, leaves, owl, accent, mx, light, ink, fx: opts.effects };
    paint(running() ? now() : STATIC_T); kick();

  }


  function paint(tt){
    const s = scene; if (!s) return;
    const fx = s.fx, ctx = vctx;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(s.base, 0, 0);
    ctx.setTransform(s.dpr, 0, 0, s.dpr, 0, 0);
    ctx.fillStyle = 'rgb(' + s.ink + ')';
    if (fx.stars) for (const st of s.stars){                     // twinkle
      ctx.globalAlpha = st.al * (.04 + .96 * Math.pow(.5 + .5 * Math.sin(tt * st.sp + st.ph), 2));
      ctx.beginPath(); ctx.arc(st.x, st.y, st.rad, 0, TAU); ctx.fill();
    }
    if (fx.clouds) for (const c of s.clouds){                    // slow drifting cloud bands
      const cx = ((c.x0 + c.sp * tt) % (s.W + 2 * c.w)) - c.w;
      for (const d of c.dots){ ctx.globalAlpha = d.a; ctx.beginPath(); ctx.arc(cx + d.dx, c.y + d.dy, d.r, 0, TAU); ctx.fill(); }
    }
    if (fx.halo) for (const h of s.halo){                        // halo breathes outward
      ctx.globalAlpha = .05 + .5 * (.5 + .5 * Math.sin(tt * 1.5 - h.ph * 3));
      ctx.beginPath(); ctx.arc(h.x, h.y, h.rad, 0, TAU); ctx.fill();
    }
    if (fx.mist) for (const m of s.mist){                        // mist rolling along the horizon
      ctx.globalAlpha = m.a * (.55 + .45 * Math.sin(tt * .45 + m.ph));
      ctx.beginPath(); ctx.arc((m.x + m.sp * tt) % s.W, m.y + Math.sin(tt * .3 + m.ph) * 1.5, m.r, 0, TAU); ctx.fill();
    }
    if (fx.reflections) for (const st of s.stars){               // stars mirrored (and wobbling) in the lake
      const ry = s.hz + (s.hz - st.y) * .35; if (ry > s.H - 3) continue;
      ctx.globalAlpha = st.al * .55 * (.1 + .9 * Math.pow(.5 + .5 * Math.sin(tt * st.sp + st.ph), 2));
      ctx.fillRect(st.x + Math.sin(tt * 1.7 + st.ph) * 2.2 - st.rad, ry, st.rad * 2.4, 1.2);
    }
    if (fx.glints){                                              // water glints under the moon
      ctx.fillStyle = s.light ? 'rgb(255,255,255)' : 'rgb(' + s.ink + ')';
      for (const g of s.glints){
        const x = s.mx + Math.sin(tt * g.sp + g.ph) * g.amp;
        const k = .5 + .5 * Math.sin(tt * g.sp * 1.9 + g.ph * 2);
        ctx.globalAlpha = g.base * k * k * (s.light ? 1 : .95);
        ctx.fillRect(x - g.w / 2, g.y, g.w, 1.7);
      }
    }
    if (fx.fireflies){                                           // blinking wandering glows
      ctx.fillStyle = 'rgb(' + s.accent + ')';
      for (const f of s.flies){
        const b = Math.pow(Math.max(0, Math.sin(tt * f.bs + f.ph * 3)), 2); if (b < .02) continue;
        const x = f.x + Math.sin(tt * f.sx + f.ph) * f.ax, y = f.y + Math.cos(tt * f.sy + f.ph * 1.7) * f.ay;
        ctx.globalAlpha = b * .32; ctx.beginPath(); ctx.arc(x, y, 6.5, 0, TAU); ctx.fill();
        ctx.globalAlpha = b; ctx.beginPath(); ctx.arc(x, y, 1.9, 0, TAU); ctx.fill();
      }
    }
    if (fx.leaves){                                              // leaves spiralling down
      ctx.fillStyle = 'rgb(' + s.ink + ')';
      for (const l of s.leaves){
        const q = ((l.sp * tt + l.off) % l.fall) / l.fall;
        const x = l.x + Math.sin(tt * .9 + l.ph) * l.sway * (.3 + q) + q * 8, y = l.y + q * l.fall;
        ctx.globalAlpha = .7 * Math.sin(Math.min(1, q * 1.2) * Math.PI);
        ctx.save(); ctx.translate(x, y); ctx.rotate(tt * 1.3 + l.ph); ctx.fillRect(-l.sz, -l.sz * .5, l.sz * 2, l.sz); ctx.restore();
      }
    }
    if (fx.owl){                                                 // blinks, glances sideways
      const o = s.owl, c = tt % 8, blink = (c > 5 && c < 5.2) || (c > 6.4 && c < 6.55);
      const look = c > 2 && c < 3.2 ? 1.6 : 0;
      if (!blink){
        ctx.fillStyle = 'rgb(' + s.accent + ')';
        for (const dx of [-3, 3]){
          ctx.globalAlpha = .28; ctx.beginPath(); ctx.arc(o.x + dx + look, o.y, 4.2, 0, TAU); ctx.fill();
          ctx.globalAlpha = .95; ctx.beginPath(); ctx.arc(o.x + dx + look, o.y, 1.5, 0, TAU); ctx.fill();
        }
        ctx.fillStyle = 'rgb(' + s.ink + ')';
      }
    }
    if (fx.ripples){                                             // rings spreading on the lake
      ctx.strokeStyle = s.light ? 'rgb(255,255,255)' : 'rgb(' + s.ink + ')'; ctx.lineWidth = .9;
      for (let r = 0; r < 2; r++){
        const T = 3.4, o = r * 1.7, k = Math.floor((tt + o) / T), a = ((tt + o) % T) / 2.6; if (a > 1) continue;
        const rx = s.W * (.46 + (Math.abs(Math.sin(k * 12.9 + r * 4.1) * 437.5) % 1) * .3);
        const ry = s.hz + (s.H - s.hz) * (.3 + (Math.abs(Math.sin(k * 78.2 + r) * 951.3) % 1) * .45);
        for (const m of [1, .6]){
          ctx.globalAlpha = (1 - a) * (s.light ? .9 : .5) * m;
          ctx.beginPath(); ctx.ellipse(rx, ry, (3 + a * 24) * m, (1 + a * 4.5) * m, 0, 0, TAU); ctx.stroke();
        }
      }
    }
    if (fx.birds){                                               // a small flock every ~16s
      const bt = (tt % 16) - 4;
      if (bt >= 0 && bt < 9){
        const pr = bt / 9, F = [[0, 0], [-20, 10], [-20, -9], [-40, 19], [-40, -17]];
        ctx.strokeStyle = 'rgb(' + s.ink + ')'; ctx.lineWidth = 1.7; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        F.forEach(([ox, oy], i) => {
          const x = -40 + pr * (s.W + 90) + ox, y = s.H * .2 + Math.sin(pr * 6.28) * s.H * .04 + oy;
          const w = Math.sin(tt * 7 + i * 1.1) * 4.5;
          ctx.globalAlpha = s.light ? .85 : .8;
          ctx.beginPath(); ctx.moveTo(x - 7.5, y - w); ctx.lineTo(x, y + 1.6); ctx.lineTo(x + 7.5, y - w); ctx.stroke();
        });
      }
    }
    if (fx.shootingStar){                                        // one streak every ~6s
      const CY = 6, ci = Math.floor(tt / CY), ph = (tt % CY) / 1.3;
      if (ph < 1){
        const r1 = Math.abs(Math.sin(ci * 12.9898) * 43758.5453) % 1, r2 = Math.abs(Math.sin(ci * 78.233) * 12345.678) % 1;
        const dir = ci % 2 ? 1 : -1, x0 = dir > 0 ? s.W * (.05 + r1 * .3) : s.W * (.65 + r1 * .3), y0 = s.H * (.08 + r2 * .18);
        const dx = dir * s.W * .42, dy = s.H * .2;
        ctx.fillStyle = 'rgb(' + s.ink + ')';
        for (let i = 0; i < 16; i++){
          const q = Math.max(0, ph - i * .012), a = (1 - i / 16) * Math.sin(Math.min(1, ph) * Math.PI);
          ctx.globalAlpha = a * .95;
          ctx.fillRect(x0 + dx * q, y0 + dy * q, i ? 1.6 : 2.4, i ? 1.6 : 2.4);
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  function tick(t){
    raf = 0; if (!running()) return;
    if (t - lastT >= 1000 / Math.max(1, opts.fps) - 1){ paint(now()); lastT = t; }
    raf = requestAnimationFrame(tick);
  }
  function kick(){ if (!raf && running()) raf = requestAnimationFrame(tick); }

  const onVisibility = () => { if (!document.hidden) kick(); };
  const onMotion = () => { paint(running() ? now() : STATIC_T); kick(); };
  document.addEventListener('visibilitychange', onVisibility);
  if (reducedMQ && reducedMQ.addEventListener) reducedMQ.addEventListener('change', onMotion);

  let io = null, ro = null;
  if (opts.pauseOffscreen && typeof IntersectionObserver === 'function'){
    io = new IntersectionObserver(es => { onScreen = es[0].isIntersecting; kick(); });
    io.observe(canvas);
  }
  if (typeof ResizeObserver === 'function'){
    ro = new ResizeObserver(() => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (!destroyed) draw(); }, 120); });
    ro.observe(canvas);
  }

  draw();

  return {
    /** Update any option (theme, colours, effects, fps, density...) and redraw. */
    setOptions(patch){ opts = merge(opts, patch); draw(); },
    /** Rebuild the scenery (e.g. after a layout change). */
    redraw(){ draw(); },
    pause(){ paused = true; },
    play(){ paused = false; kick(); },
    /** Stop animating and remove every observer/listener. Call on unmount. */
    destroy(){
      destroyed = true; cancelAnimationFrame(raf); raf = 0; clearTimeout(resizeTimer);
      document.removeEventListener('visibilitychange', onVisibility);
      if (reducedMQ && reducedMQ.removeEventListener) reducedMQ.removeEventListener('change', onMotion);
      if (io) io.disconnect(); if (ro) ro.disconnect();
      scene = null;
    },
  };
}



/* ============ demo wiring ============ */
const lake = createPixelLake(document.getElementById('lake'), { theme: 'dark' });
let theme = 'dark';
document.getElementById('themeBtn').onclick = e => {
  theme = theme === 'dark' ? 'light' : 'dark';
  document.body.classList.toggle('light', theme === 'light');
  e.target.textContent = 'theme: ' + theme;
  lake.setOptions({ theme });
};
const dens = document.getElementById('density'), fps = document.getElementById('fps');
dens.oninput = () => { document.getElementById('dv').textContent = (+dens.value).toFixed(1); lake.setOptions({ density: +dens.value }); };
fps.oninput  = () => { document.getElementById('fv').textContent = fps.value; lake.setOptions({ fps: +fps.value }); };
const box = document.getElementById('effects');
for (const k of Object.keys(DEFAULTS.effects)){
  const l = document.createElement('label'), c = document.createElement('input');
  c.type = 'checkbox'; c.checked = true;
  c.onchange = () => lake.setOptions({ effects: { [k]: c.checked } });
  l.append(c, k); box.append(l);
}
